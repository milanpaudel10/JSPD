<!DOCTYPE html>
<html>
<head>
    <title>JS Comparison Operators</title>
</head>
<body>

<h2>JavaScript Comparison Operators</h2>

<p id="result"></p>

<script>
let a = 10;
let b = 20;

let output = "";

output += "a == b : " + (a == b) + "<br>";
output += "a != b : " + (a != b) + "<br>";
output += "a > b : " + (a > b) + "<br>";
output += "a < b : " + (a < b) + "<br>";
output += "a >= b : " + (a >= b) + "<br>";
output += "a <= b : " + (a <= b) + "<br>";
output += "a === b : " + (a === b) + "<br>";
output += "a !== b : " + (a !== b) + "<br>";

document.getElementById("result").innerHTML = output;
</script>

</body>
</html>
