<!DOCTYPE html>
<html>
<head>
    <title>Do While Example</title>
</head>
<body>

<h2>JavaScript do...while Loop</h2>
<p id="demo"></p>

<script>
let i = 1;
let text = "";

do {
    text += "Number: " + i + "<br>";
    i++;
} while (i <= 5);

document.getElementById("demo").innerHTML = text;
</script>

</body>
</html>
