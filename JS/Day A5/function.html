<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Function Declaration</title>
</head>
<body>

<h2>Function Declaration Example</h2>

<button onclick="greetUser()">Click Me</button>

<p id="output"></p>

<script>
    
    function greetUser() {
        let name = "Milan";
        document.getElementById("output").innerHTML =
            "Hello, " + name + "! Welcome to JavaScript.";
    }
</script>

</body>
</html>
