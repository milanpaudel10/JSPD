<!DOCTYPE html>
<html>
<head>
    <title>If Else Example</title>
</head>
<body>

<h2>JavaScript If-Else Example</h2>
<p id="result"></p>

<script>
let age = 18;

if (age >= 18) {
    document.getElementById("result").innerHTML = "You are eligible to vote.";
} else {
    document.getElementById("result").innerHTML = "You are not eligible to vote.";
}
</script>

</body>
</html>
